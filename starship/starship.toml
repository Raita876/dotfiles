"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
[╭─](bold green) $os$directory$git_branch$git_status$git_state\
$nodejs$python$golang$rust$ruby$java$package$cmd_duration
[╰─](bold green)$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[✗](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[os]
disabled = false
style    = "bold blue"

[git_status]
style      = "bold yellow"
conflicted = "⚔ "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "?${count} "
stashed    = "📦 "
modified   = "!${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "

[cmd_duration]
min_time = 2000
format   = " took [$duration]($style) "
style    = "yellow bold"

