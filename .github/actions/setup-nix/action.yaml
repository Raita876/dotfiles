name: Setup Nix
description: Install Nix and restore cached store paths
runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'agents/skills/**', 'templates/**', '.github/actions/**', '.github/workflows/**') }}
        restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-
