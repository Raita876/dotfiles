name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # agents/skills はディレクトリ一覧を Nix が readDir で読むので、ビルド結果に影響する
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'agents/skills/**'
              - 'templates/**'
              - '.github/workflows/**'

  nix-lint:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check Nix sources and lint regression tests
        run: nix build .#checks.x86_64-linux.nix-lint .#checks.x86_64-linux.nix-lint-tests --no-link --print-build-logs

  build:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
    # 設定が aarch64-darwin 専用なので、Apple Silicon の macOS でビルドする
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Evaluate flake
        run: nix flake check --no-build --show-trace

      - name: Check Homebrew
        run: nix build .#checks.aarch64-darwin.homebrew --no-link --print-build-logs

      # switch はシステムを書き換えるので CI では実行せず、その中身のビルドが通るかだけを見る
      - name: Build system
        run: nix build .#darwinConfigurations.raita-mba.system --print-build-logs --show-trace
