name: Update flake.lock

on:
  schedule:
    # 毎朝 08:00 JST (= 23:00 UTC)。GitHub の混雑で数十分遅れることがある
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    # 設定が aarch64-darwin 専用なので、ビルド確認も Apple Silicon の macOS で行う
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      SYSTEM_ATTR: .#darwinConfigurations.raita-mba.system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # 比較元として、更新前の main をビルドしておく。
      # create-pull-request は作業ツリーの変更をコミットするので、out-link はリポジトリの外に置く
      - name: Build current system
        run: nix build "$SYSTEM_ATTR" --out-link "$RUNNER_TEMP/old"

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2> "$RUNNER_TEMP/flake-update.log"
          cat "$RUNNER_TEMP/flake-update.log"
          if git diff --quiet -- flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated system
        if: steps.update.outputs.updated == 'true'
        run: nix build "$SYSTEM_ATTR" --out-link "$RUNNER_TEMP/new"

      # nixpkgs のコミットが変わるだけでも、ソースや manual などコミット番号を含むパスは必ず変わる。
      # それ以外のパスが変わったとき (バージョンの変化だけでなく、同じバージョンへのパッチも含む) だけ PR を作る
      - name: Compare closures
        id: compare
        if: steps.update.outputs.updated == 'true'
        run: |
          comm -3 \
            <(nix-store --query --requisites "$RUNNER_TEMP/old" | sort) \
            <(nix-store --query --requisites "$RUNNER_TEMP/new" | sort) \
            | tr -d '\t' \
            | sed -E 's|^/nix/store/[a-z0-9]{32}-||' \
            | sort -u \
            | grep -v -x -E 'source|etc|etc-registry\.json|darwin-version\.json|darwin-help|darwin-manpages|darwin-manual-html|system-path|system-applications|darwin-system-.*' \
            > "$RUNNER_TEMP/changed.txt" || true

          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo '## 判定'
            echo
            if [ -s "$RUNNER_TEMP/changed.txt" ]; then
              echo 'パッケージに変化があるので PR を作る。変わったパス:'
              echo
              echo '```'
              cat "$RUNNER_TEMP/changed.txt"
              echo '```'
            else
              echo 'パッケージに変化がないので PR は作らない。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write PR body
        if: steps.compare.outputs.changed == 'true'
        run: |
          {
            echo '## flake.lock の更新'
            echo
            echo '```'
            grep -E '^(•|  )' "$RUNNER_TEMP/flake-update.log" || true
            echo '```'
            echo
            echo '## パッケージの差分'
            echo
            echo '```'
            nix run nixpkgs#nvd -- diff "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
            echo '```'
            echo
            # shellcheck disable=SC2016 # バッククォートは Markdown のコード表記
            echo '反映するには、マージ後に手元で `git pull && nix run .#switch` を実行する。'
          } > "$RUNNER_TEMP/pr-body.md"

      # PR を GITHUB_TOKEN で作ると他の workflow が起動しないため、ビルド確認は上のステップで済ませている
      - name: Open PR
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update_flake_lock_action
          add-paths: flake.lock
          commit-message: 'flake.lock: update'
          title: 'flake.lock: update'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: |
            dependencies
            automated
