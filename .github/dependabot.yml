version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/nix/packages/pi-extensions"
    schedule:
      interval: "weekly"
    groups:
      pi-extensions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
